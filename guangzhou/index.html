<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行行程</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF6;--ink:#3E3A39;--pink:#F2A497;--yellow:#F6D27A;--blue:#A8D3E6;--green:#B9DAA5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Huninn",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-top:60px}
nav{position:fixed;top:0;left:0;right:0;background:var(--bg);border-bottom:3px solid var(--ink);display:flex;justify-content:center;gap:6px;padding:10px;z-index:9;overflow-x:auto}
nav a{color:var(--ink);text-decoration:none;padding:4px 12px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-size:14px;white-space:nowrap}
nav a:hover{background:var(--yellow)}
main{max-width:640px;margin:0 auto;padding:16px}
section{margin:28px 0}
h2{font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:14px;height:14px;border:3px solid var(--ink);border-radius:50%;background:var(--pink)}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;margin-bottom:14px}
.hero{text-align:center;background:var(--blue);border:3px solid var(--ink);border-radius:28px;padding:18px 14px 22px;overflow:hidden}
.hero h1{font-size:28px;margin-top:6px}
.hero p{font-size:15px}
.count{display:flex;justify-content:center;gap:8px;margin-top:12px}
.count div{background:var(--bg);border:3px solid var(--ink);border-radius:16px;padding:6px 10px;min-width:62px}
.count b{display:block;font-size:24px}
.count span{font-size:12px}
.flight{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flight .ap{text-align:center}.flight .ap b{font-size:26px;display:block}
.flight .line{flex:1;border-top:3px dashed var(--ink);position:relative}
.flight .line::after{content:"✈";position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:20px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border:2px solid var(--ink);border-radius:999px;margin:2px 4px 2px 0}
.t-car{background:var(--yellow)}.t-walk{background:var(--green)}.t-air{background:var(--blue)}.t-must{background:var(--pink);font-weight:bold}
.days{display:flex;gap:8px;margin-bottom:14px}
.days button{flex:1;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 4px;cursor:pointer}
.days button.on{background:var(--yellow)}
.day{display:none}.day.show{display:block;animation:pop .5s}
@keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;border-left:3px solid var(--ink)}
.ev{position:relative;margin-bottom:14px}
.ev::before{content:"";position:absolute;left:-25px;top:6px;width:14px;height:14px;border:3px solid var(--ink);border-radius:50%;background:var(--green)}
.ev.must::before{background:var(--pink)}
.ev time{font-weight:bold;margin-right:6px}
.ev small{display:block;opacity:.8}
.note{background:var(--bg);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;font-size:14px;margin-top:6px}
ul.todo{list-style:none}
ul.todo li{margin:6px 0}
ul.todo label{display:flex;gap:10px;align-items:center;cursor:pointer}
ul.todo input{appearance:none;width:22px;height:22px;border:3px solid var(--ink);border-radius:7px;background:#fff;flex:none}
ul.todo input:checked{background:var(--green)}
ul.todo input:checked+span{text-decoration:line-through;opacity:.6}
.food h3{font-size:17px}.food p{font-size:14px}
footer{text-align:center;font-size:13px;padding:20px 0 40px}
.float{animation:float 4s ease-in-out infinite}
.spin{transform-origin:center;animation:sway 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes sway{50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav>
<a href="#home">首頁</a><a href="#flight">航班</a><a href="#plan">行程</a><a href="#food">吃飯</a><a href="#stay">住宿</a><a href="#todo">清單</a>
</nav>
<main>
<section id="home" class="hero">
<svg viewBox="0 0 320 170" width="100%" aria-hidden="true">
 <rect x="0" y="120" width="320" height="50" fill="#B9DAA5"/>
 <circle cx="270" cy="38" r="20" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" class="float"/>
 <g class="float"><ellipse cx="60" cy="40" rx="26" ry="12" fill="#fff" stroke="#3E3A39" stroke-width="3"/></g>
 <!-- Canton Tower -->
 <g class="spin">
 <path d="M150 128 L156 60 L152 40 L160 10 L168 40 L164 60 L170 128 Z" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
 <line x1="154" y1="80" x2="166" y2="80" stroke="#3E3A39" stroke-width="3"/>
 <line x1="153" y1="100" x2="167" y2="100" stroke="#3E3A39" stroke-width="3"/>
 </g>
 <!-- buildings -->
 <rect x="90" y="85" width="34" height="43" rx="6" fill="#fff" stroke="#3E3A39" stroke-width="3"/>
 <rect x="196" y="75" width="40" height="53" rx="6" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
 <!-- plane -->
 <g class="float"><path d="M20 90 l40 -8 l14 -12 l6 2 l-8 12 l24 -4 l4 4 l-56 14 z" fill="#fff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g>
 <!-- little rose (小王子) -->
 <g><line x1="262" y1="128" x2="262" y2="104" stroke="#3E3A39" stroke-width="3"/><circle cx="262" cy="100" r="8" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/></g>
</svg>
<p>出發地 → 目的地</p>
<h1>旅行標題</h1>
<p>日期</p>
<div class="count" id="count"><div><b id="d">-</b><span>天</span></div><div><b id="h">-</b><span>時</span></div><div><b id="m">-</b><span>分</span></div></div>
</section>

<section id="flight">
<h2>航班</h2>
<div class="card"><span class="tag t-air">去程</span>
<div class="flight"><div class="ap"><b>---</b>--:--</div><div class="line"></div><div class="ap"><b>---</b>--:--</div></div></div>
<div class="card"><span class="tag t-air">回程</span>
<div class="flight"><div class="ap"><b>---</b>--:--</div><div class="line"></div><div class="ap"><b>---</b>--:--</div></div></div>
</section>

<section id="plan">
<h2>每日行程</h2>
<div class="days">
<button class="on" data-d="1">Day 1</button>
<button data-d="2">Day 2</button>
<button data-d="3">Day 3</button>
</div>
<div class="day show" id="day1"><div class="tl"><div class="ev"><time>--:--</time>　</div></div></div>
<div class="day" id="day2"><div class="tl"><div class="ev"><time>--:--</time>　</div></div></div>
<div class="day" id="day3"><div class="tl"><div class="ev"><time>--:--</time>　</div></div></div>
</section>

<section id="food">
<h2>吃飯口袋名單</h2>
<div class="card food"><h3>　</h3><p>　</p></div>
</section>

<section id="stay">
<h2>住宿</h2>
<div class="card"><h3>　</h3><p>　</p></div>
</section>

<section id="todo">
<h2>出發清單</h2>
<div class="card"><ul class="todo">
<li><label><input type="checkbox"><span>　</span></label></li>
</ul></div>
</section>
<footer>　</footer>
</main>
<script>
document.querySelectorAll('.days button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.days button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 document.querySelectorAll('.day').forEach(x=>x.classList.remove('show'));document.getElementById('day'+b.dataset.d).classList.add('show');});
</script>
</body>
</html>
